[General]
Enabled=true
; Key names: https://learn.microsoft.com/dotnet/api/system.windows.forms.keys
ToggleKey=F7
; Toggles the debug overlay (route line, destination/blip info). None = disabled.
DebugKey=None
ShowDebug=false
; Hide the arrows when the HUD is switched off in the game's display settings.
HideWhenHudOff=true

[Destination]
; The map waypoint always wins over mission blips.
UseWaypoint=true
UseMissionBlips=true
; Mission blips are long-range blips with one of these icon ids (0 = plain blip).
MissionBlipIcons=0
; Optional colour filter (comma separated ids, empty = any colour).
; Turn on ShowDebug to see the icon/colour ids of nearby blips.
MissionBlipColours=
; Arrows are hidden when closer than this to the destination (metres).
ArriveDistance=20

[Route]
; GameGPS = follow exactly the route the game's GPS plotted (the minimap line), read from game memory.
;           Only for GTA IV 1.2.0.59; on other versions the mod falls back to Tracer automatically.
; Tracer  = trace the road ahead itself (older behaviour). The settings below apply to Tracer only.
Source=GameGPS
; The road ahead is re-traced at most this often (ms), and only after the car has moved RebuildDistance
; metres (or once a second, or when the traced road ahead is getting short).
RefreshIntervalMs=200
RebuildDistance=5
; Max number of the game's pathfinder calls per re-trace (each is a full route search). New junctions
; are resolved over a few re-traces instead of all at once, which avoids stutters.
PathfinderCallsPerBuild=3
; Detect when the route continues behind the car (puts the arrows on the route behind you).
; Set to false if it misfires.
DetectWrongWay=true
; Distance between traced road samples (metres).
StepLength=10
; How far ahead the road is traced (metres).
MaxLength=150
; How many nearby road nodes are considered at each step (junction detection).
NodeCandidates=8
; Use the game's road-network distance to choose the branch at junctions.
; If false, the branch closest (straight-line) to the destination is used.
UseTravelDistance=true

[Arrows]
; true = arrows follow the lane the car is driving in, false = they stay on the road centre line.
FollowLane=false
MaxLaneOffset=7
; Show arrows further ahead the faster you drive: Objects.MaxDistance grows by SpeedLookahead seconds
; of driving at the current speed (0 = off), up to SpeedMaxDistance metres. MaxCount grows with it so
; the spacing stays the same (at most 30 arrows).
; With Source=Tracer the road is only traced Route.MaxLength metres ahead.
SpeedLookahead=2.0
SpeedMaxDistance=150

[Objects]
; Arrows are the game's flat route arrow (CJ_R_ICON_ARROW) laid on the road.
; Props can't be scaled, so arrows are sunk into the road to look lower:
; 0 = full height, 0.5 = half of the arrow is below the road surface.
Sink=0.5
; Fade arrows in at the far end (over FadeInDistance metres before MaxDistance), out as they near the car
; (over FadeOutDistance metres after MinDistance), and in over FadeTimeMs when they first appear.
Fade=true
FadeInDistance=15
FadeOutDistance=6
FadeTimeMs=400
; A small light just above every arrow so it glows and lights up the road under it.
Glow=true
; R,G,B
GlowColor=255,110,0
GlowIntensity=5.0
GlowRange=5
; height of the light above the top of the arrow (metres)
GlowHeight=0.6
; Dynamic lights cost GPU time; only the nearest N arrows get one (0 = no lights).
GlowMaxLights=3
HeightAboveRoad=0.05
Spacing=9
; arrows closer than this to the car (along the road or in a straight line) are removed
MinDistance=18
MaxDistance=60
MaxCount=10

[Camera]
; Only used by the debug route line: change this if the line doesn't sit on the road.
; Vertical or Horizontal
FovMode=Vertical
