[General]
Enabled=true
; Key names: https://learn.microsoft.com/dotnet/api/system.windows.forms.keys
ToggleKey=F7
; Toggles the debug overlay (route line, route source, timings). None = disabled.
DebugKey=None
ShowDebug=false
; Hide the arrows when the HUD is switched off in the game's display settings.
HideWhenHudOff=true

[Destination]
; Arrows are hidden when closer than this to the end of the GPS route (metres).
ArriveDistance=20

[Route]
; The arrows follow the route the game's GPS plotted (the minimap line), read from game memory.
; It is re-read at most this often (ms), and only after the car has moved RebuildDistance metres
; (or once a second, or when the route ahead is getting short).
RefreshIntervalMs=200
RebuildDistance=5

[Arrows]
; true = arrows follow the lane the car is driving in, false = they stay on the road centre line.
FollowLane=false
MaxLaneOffset=7
; Show arrows further ahead the faster you drive: Objects.MaxDistance grows by SpeedLookahead seconds
; of driving at the current speed (0 = off), up to SpeedMaxDistance metres. MaxCount grows with it so
; the spacing stays the same (at most 30 arrows).
SpeedLookahead=2.0
SpeedMaxDistance=150

[Objects]
; Arrows are the game's flat route arrow (CJ_R_ICON_ARROW) laid on the road.
; Props can't be scaled, so arrows are sunk into the road to look lower:
; 0 = full height, 0.5 = half of the arrow is below the road surface.
Sink=0.5
; Fade arrows in at the far end (over FadeInDistance metres before MaxDistance), out as they near the car
; (over FadeOutDistance metres after MinDistance), and in over FadeTimeMs when they first appear.
Fade=true
FadeInDistance=15
FadeOutDistance=6
FadeTimeMs=400
; A small light just above every arrow so it glows and lights up the road under it.
Glow=true
; R,G,B
GlowColor=255,110,0
GlowIntensity=5.0
GlowRange=5
; height of the light above the top of the arrow (metres)
GlowHeight=0.6
; Dynamic lights cost GPU time; only the nearest N arrows get one (0 = no lights).
GlowMaxLights=3
HeightAboveRoad=0.05
Spacing=9
; arrows closer than this to the car (along the road or in a straight line) are removed
MinDistance=18
MaxDistance=60
MaxCount=10

[Camera]
; Only used by the debug route line: change this if the line doesn't sit on the road.
; Vertical or Horizontal
FovMode=Vertical
