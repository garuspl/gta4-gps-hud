name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  SHDN_URL: https://github.com/Tomasak/gta4_scripthookdotnet/releases/download/release/scripthookdotnet_v1.7.1.8.zip

jobs:
  build:
    runs-on: windows-latest
    env:
      NEXUSMODS_API_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
    steps:
      - uses: actions/checkout@v5

      - name: Download ScriptHookDotNet
        shell: pwsh
        run: |
          Invoke-WebRequest $env:SHDN_URL -OutFile shdn.zip
          Expand-Archive shdn.zip -DestinationPath shdn-src
          $asi = Get-ChildItem shdn-src -Recurse -Filter ScriptHookDotNet.asi | Select-Object -First 1
          if (-not $asi) { throw "ScriptHookDotNet.asi not found in the downloaded zip." }
          "SHDN_DIR=$($asi.DirectoryName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build
        shell: pwsh
        run: ./build.ps1 -ShdnDir $env:SHDN_DIR

      - name: Package
        shell: pwsh
        run: |
          $name = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "dev-$($env:GITHUB_SHA.Substring(0, 7))" }
          New-Item -ItemType Directory -Force dist/pkg/scripts | Out-Null
          Copy-Item bin/GPSHud.net.dll, bin/GPSHud.ini dist/pkg/scripts
          Copy-Item README.md dist/pkg
          Compress-Archive dist/pkg/* "dist/GPSHud-$name.zip"
          "PKG=dist/GPSHud-$name.zip" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "VERSION=$($name -replace '^v', '')" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - uses: actions/upload-artifact@v7
        with:
          name: GPSHud
          path: dist/pkg/

      - name: Publish release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME $env:PKG --title "GPS HUD $env:GITHUB_REF_NAME" --generate-notes

      # Adds the release as a new version of the existing file on the Nexus Mods page. Needs the
      # NEXUSMODS_API_KEY secret and the NEXUSMODS_FILE_ID variable; skipped until both are set.
      - name: Upload to Nexus Mods
        if: github.ref_type == 'tag' && env.NEXUSMODS_API_KEY != '' && vars.NEXUSMODS_FILE_ID != ''
        uses: Nexus-Mods/upload-action@98532f7670c27cbecc78fae03fa3e278147827e2 # v1.0.0-beta.11
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ vars.NEXUSMODS_FILE_ID }}
          filename: ${{ env.PKG }}
          version: ${{ env.VERSION }}
          display_name: GPS HUD ${{ github.ref_name }}
          archive_existing_version: true
          update_mod_version: true
