name: Nexus changelog

# One-off helper: copy the GitHub release body to the matching Nexus Mods file version.
# The release workflow does this itself now; this exists for a version that was uploaded before
# the composite v3 mod id was used.
on:
  workflow_dispatch:
    inputs:
      release:
        description: Release tag whose body should be used
        required: true
        default: v1.2.1

permissions:
  contents: read

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Copy release notes to Nexus Mods
        env:
          GH_TOKEN: ${{ github.token }}
          NEXUS_API_KEY: ${{ secrets.NEXUS_API_KEY }}
          MOD_ID: "1086626727562"
          RELEASE: ${{ inputs.release }}
        run: |
          gh release view "$RELEASE" -R "$GITHUB_REPOSITORY" --json body --jq .body > changelog.md
          python3 - <<'PY'
          import json, os, sys, urllib.error, urllib.request

          changelog = open("changelog.md", encoding="utf-8").read().strip()
          if not changelog:
              sys.exit("release body is empty")
          version = os.environ["RELEASE"].lstrip("v")
          body = json.dumps({"version": version, "changelog": changelog}).encode("utf-8")
          req = urllib.request.Request(
              "https://api.nexusmods.com/v3/mods/%s/changelogs" % os.environ["MOD_ID"],
              data=body,
              method="POST",
              headers={
                  "apikey": os.environ["NEXUS_API_KEY"],
                  "Content-Type": "application/json",
                  "User-Agent": "gta4-gps-hud-release",
              },
          )
          try:
              with urllib.request.urlopen(req) as response:
                  print("HTTP", response.status)
                  print(response.read().decode("utf-8"))
          except urllib.error.HTTPError as error:
              print("HTTP", error.code)
              print(error.read().decode("utf-8"))
              raise
          PY
